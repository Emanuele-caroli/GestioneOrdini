services:
  postgres:
    image: postgres:17
    container_name: gestione-ordini-db
    environment:
      POSTGRES_DB: gestione_ordini
      POSTGRES_USER: ordini
      POSTGRES_PASSWORD: ordini
    ports:
      - "5436:5432"
    volumes:
      - ordini-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordini -d gestione_ordini"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    container_name: spring-course-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - dati-mongodb:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - root
        - --password
        - root
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ordini-data:
  dati-mongodb:
